apiVersion: dapr.io/v2alpha1
kind: Subscription

metadata:
  name: book-ticket-payment-subscription
  namespace: default

spec:

  # Kafka topic
  topic: book.ticket

  # Dapr Pub/Sub component
  pubsubname: pubsub-kafka

  # HTTP endpoint inside Order Service
  routes:
    default: /api/payments/events/book-ticket

scopes:
  - payment-service